<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Card / Emblem -->
  <rect x="76" y="96" width="360" height="320" rx="48" fill="#ffffff" filter="url(#shadow)" />

  <!-- Stylized "AYT" Logo inside emblem -->
  <!-- Letter A (Blue) -->
  <path d="M140 330 L195 180 L235 180 L290 330 L250 330 L238 295 L192 295 L180 330 Z M202 265 L228 265 L215 225 Z" fill="#1e40af" />

  <!-- Letter Y (Silver / Grey with swoop) -->
  <path d="M245 180 L285 180 L315 240 L345 180 L385 180 L335 260 L335 330 L295 330 L295 260 Z" fill="url(#silverGrad)" />

  <!-- Letter T (Dark Navy) -->
  <path d="M330 180 L420 180 L420 215 L390 215 L390 330 L355 330 L355 215 L330 215 Z" fill="#172554" />

  <!-- Speed Swoop Curve underneath -->
  <path d="M120 345 Q 260 385 410 320 Q 280 365 140 345 Z" fill="#2563eb" />
  <path d="M130 355 Q 250 395 380 340 Q 260 380 150 355 Z" fill="url(#silverGrad)" />

  <!-- Subtitle Text -->
  <text x="256" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="4">
    EKSPEDISI
  </text>
</svg>
